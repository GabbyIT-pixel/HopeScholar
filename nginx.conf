# nginx.conf — HopeScholar | gabrielmugisha.tech
# ── WEB01 & WEB02 ─────────────────────────────────────────────
server {
    listen 80; server_name _;
    root /var/www/hopescholar; index index.html;
    location / { try_files $uri $uri/ /index.html; }
    location ~* \.(css|js|png|jpg|svg|ico|woff2?)$ { expires 30d; add_header Cache-Control "public, immutable"; }
    location /health { return 200 'OK'; add_header Content-Type text/plain; }
    access_log /var/log/nginx/hopescholar.log;
}
# ── LB01 — Run certbot first ──────────────────────────────────
upstream hopescholar_pool { server 54.227.215.118; server 3.83.142.166; keepalive 32; }
server { listen 80; server_name gabrielmugisha.tech www.gabrielmugisha.tech; return 301 https://$host$request_uri; }
server {
    listen 443 ssl http2; server_name gabrielmugisha.tech www.gabrielmugisha.tech;
    ssl_certificate /etc/letsencrypt/live/gabrielmugisha.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gabrielmugisha.tech/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    location / { proxy_pass http://hopescholar_pool; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header Connection ""; }
    location /health { return 200 'LB OK'; add_header Content-Type text/plain; }
}
