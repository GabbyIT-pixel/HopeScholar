# ══════════════════════════════════════════════════════════════
# nginx.conf — HopeScholar
# Domain: gabrielmugisha.tech | Author: Gabriel Mugisha | ALU
# ══════════════════════════════════════════════════════════════

# ── WEB01 & WEB02 — /etc/nginx/sites-available/hopescholar ───
server {
    listen 80;
    server_name _;
    root  /var/www/hopescholar;
    index index.html;
    location / { try_files $uri $uri/ /index.html; }
    location ~* \.(css|js|png|jpg|svg|ico|woff2?)$ { expires 30d; add_header Cache-Control "public, immutable"; }
    location /health { return 200 'OK'; add_header Content-Type text/plain; }
    access_log /var/log/nginx/hopescholar_access.log;
    error_log  /var/log/nginx/hopescholar_error.log;
}

# ── LB01 — /etc/nginx/sites-available/hopescholar ────────────
# Run certbot FIRST: sudo certbot --nginx -d gabrielmugisha.tech -d www.gabrielmugisha.tech

upstream hopescholar_pool {
    server 54.227.215.118;   # Web01
    server 3.83.142.166;     # Web02
    keepalive 32;
}
server {
    listen 80;
    server_name gabrielmugisha.tech www.gabrielmugisha.tech;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl http2;
    server_name gabrielmugisha.tech www.gabrielmugisha.tech;
    ssl_certificate     /etc/letsencrypt/live/gabrielmugisha.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gabrielmugisha.tech/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    location / {
        proxy_pass         http://hopescholar_pool;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
        proxy_connect_timeout 10s;
        proxy_read_timeout    20s;
    }
    location /health { return 200 'LB OK\n'; add_header Content-Type text/plain; }
    access_log /var/log/nginx/hopescholar_lb.log;
    error_log  /var/log/nginx/hopescholar_lb_error.log;
}
