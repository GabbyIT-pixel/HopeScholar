# docker-compose.yml — HopeScholar
# Run: docker-compose up -d  |  Open: http://localhost:8080
version: '3.8'
services:
  hopescholar:
    build: .
    container_name: hopescholar
    ports:
      - "8080:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD","wget","-qO-","http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3
