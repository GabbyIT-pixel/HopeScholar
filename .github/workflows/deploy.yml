# .github/workflows/deploy.yml — CI/CD (Bonus Task)
name: Deploy HopeScholar
on:
  push:
    branches: [main]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/school
          chmod 600 ~/.ssh/school
          ssh-keyscan -H ${{ secrets.WEB01_IP }} >> ~/.ssh/known_hosts
          ssh-keyscan -H ${{ secrets.WEB02_IP }} >> ~/.ssh/known_hosts
      - name: Deploy to Web01
        run: |
          ssh -i ~/.ssh/school ubuntu@${{ secrets.WEB01_IP }} "sudo mkdir -p /var/www/hopescholar"
          scp -i ~/.ssh/school -r ./* ubuntu@${{ secrets.WEB01_IP }}:/var/www/hopescholar/
          ssh -i ~/.ssh/school ubuntu@${{ secrets.WEB01_IP }} "sudo systemctl reload nginx"
      - name: Deploy to Web02
        run: |
          ssh -i ~/.ssh/school ubuntu@${{ secrets.WEB02_IP }} "sudo mkdir -p /var/www/hopescholar"
          scp -i ~/.ssh/school -r ./* ubuntu@${{ secrets.WEB02_IP }}:/var/www/hopescholar/
          ssh -i ~/.ssh/school ubuntu@${{ secrets.WEB02_IP }} "sudo systemctl reload nginx"
      - name: Verify
        run: |
          curl --fail http://${{ secrets.WEB01_IP }}/health && echo "Web01 OK"
          curl --fail http://${{ secrets.WEB02_IP }}/health && echo "Web02 OK"
